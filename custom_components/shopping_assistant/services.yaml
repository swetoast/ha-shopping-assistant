name_product:
  fields:
    ean:
      required: true
      example: "7318690101234"
      selector:
        text:
    name:
      required: true
      example: "Oatly Oat Drink 1 l"
      selector:
        text:
    add_to_shopping_list:
      default: false
      selector:
        boolean:

name_last_unknown:
  fields:
    name:
      required: true
      example: "Store brand milk 1 l"
      selector:
        text:
    add_to_shopping_list:
      default: true
      selector:
        boolean:

remove_product:
  fields:
    ean:
      required: true
      example: "7318690101234"
      selector:
        text:

lookup_product:
  fields:
    ean:
      required: true
      example: "3017624010701"
      selector:
        text:
    force_refresh:
      default: false
      selector:
        boolean:

add_scanned_to_shopping_list:
  fields:
    ean:
      required: true
      example: "3017624010701"
      selector:
        text:
    quantity:
      example: "2"
      selector:
        text:

list_unknowns:

export_data:

import_data:
  fields:
    data:
      required: true
      selector:
        object:
    merge:
      default: true
      selector:
        boolean:

reset_database:
  fields:
    confirm:
      required: true
      default: false
      selector:
        boolean:
    sections:
      default:
        - products
        - unknowns
        - shopping_list
        - statistics
      selector:
        select:
          multiple: true
          translation_key: reset_sections
          options:
            - products
            - unknowns
            - shopping_list
            - statistics
    older_than_days:
      example: 365
      selector:
        number:
          min: 1
          max: 3650
          unit_of_measurement: days
          mode: box

add_price:
  fields:
    ean:
      required: true
      example: "7318690101234"
      selector:
        text:
    price:
      required: true
      example: 25.90
      selector:
        number:
          min: 0
          max: 99999
          step: 0.01
          mode: box
    currency:
      example: "SEK"
      selector:
        text:
    store:
      example: "ICA"
      selector:
        text:

set_expiry:
  fields:
    ean:
      required: true
      example: "7318690101234"
      selector:
        text:
    expiry_date:
      required: true
      selector:
        date:

add_to_shopping_list:
  fields:
    name:
      required: true
      example: "Bananas"
      selector:
        text:
    quantity:
      example: "6"
      selector:
        text:
    note:
      example: "Ripe ones"
      selector:
        text:

update_shopping_list_item:
  fields:
    item:
      example: "3f2a9c0e5b7d4e1f8a6b2c4d9e0f1a3b"
      selector:
        text:
    ean:
      example: "7318690101234"
      selector:
        text:
    name:
      selector:
        text:
    quantity:
      example: "2"
      selector:
        text:
    note:
      selector:
        text:

remove_from_shopping_list:
  fields:
    item:
      example: "3f2a9c0e5b7d4e1f8a6b2c4d9e0f1a3b"
      selector:
        text:
    ean:
      example: "7318690101234"
      selector:
        text:

clear_shopping_list:

get_shopping_list:

update_product:
  fields:
    ean:
      required: true
      example: "7318690101234"
      selector:
        text:
    name:
      example: "Oatly Oat Drink 1 l"
      selector:
        text:
    brands:
      example: "Oatly"
      selector:
        text:
    quantity:
      example: "1 l"
      selector:
        text:
    categories:
      example: "Plant-based milks, Oat drinks"
      selector:
        text:
    ingredients_text:
      example: "Water, oats 10%, rapeseed oil, salt"
      selector:
        text:
          multiline: true
    allergens:
      example: "Oats"
      selector:
        text:
    traces:
      example: "Nuts"
      selector:
        text:
    labels:
      example: "Organic, Vegan"
      selector:
        text:
    stores:
      example: "ICA, Coop"
      selector:
        text:
    origins:
      example: "Sweden"
      selector:
        text:
    packaging:
      example: "Carton"
      selector:
        text:
    energy_kcal:
      selector:
        number:
          min: 0
          step: 1
          unit_of_measurement: "kcal"
          mode: box
    energy_kj:
      selector:
        number:
          min: 0
          step: 1
          unit_of_measurement: "kJ"
          mode: box
    fat:
      selector:
        number:
          min: 0
          step: 0.1
          unit_of_measurement: "g"
          mode: box
    saturated_fat:
      selector:
        number:
          min: 0
          step: 0.1
          unit_of_measurement: "g"
          mode: box
    carbohydrates:
      selector:
        number:
          min: 0
          step: 0.1
          unit_of_measurement: "g"
          mode: box
    sugars:
      selector:
        number:
          min: 0
          step: 0.1
          unit_of_measurement: "g"
          mode: box
    fiber:
      selector:
        number:
          min: 0
          step: 0.1
          unit_of_measurement: "g"
          mode: box
    proteins:
      selector:
        number:
          min: 0
          step: 0.1
          unit_of_measurement: "g"
          mode: box
    salt:
      selector:
        number:
          min: 0
          step: 0.01
          unit_of_measurement: "g"
          mode: box
    sodium:
      selector:
        number:
          min: 0
          step: 0.001
          unit_of_measurement: "g"
          mode: box
    notes:
      example: "Buy the large pack"
      selector:
        text:
          multiline: true
    add_to_shopping_list:
      default: false
      selector:
        boolean:
    submit_to_openfoodfacts:
      default: false
      selector:
        boolean:
    username:
      selector:
        text:
    password:
      selector:
        text:
          type: password

